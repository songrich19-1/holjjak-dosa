  .app::after {
    content: ""; position: absolute; inset: 0; z-index: 0; transition: background 0.3s;
    background: linear-gradient(180deg, rgba(18,16,28,0.6) 0%, rgba(18,16,28,0.68) 45%, rgba(18,16,28,0.82) 100%);
  }
  body.flash-win .app::after { background: linear-gradient(180deg, rgba(20,70,45,0.6), rgba(18,16,28,0.8)); }
  body.flash-lose .app::after { background: linear-gradient(180deg, rgba(100,25,40,0.6), rgba(18,16,28,0.8)); }

  .app { position: relative; width: 100%; max-width: 480px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .scroller { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; padding: 16px; }
  /* 넓은 화면(PC, 큰 패널)에서는 항상 핸드폰 크기의 프레임 안에 그린다. 실제 폰에서는 전체 화면. */
  @media (min-width: 600px) and (min-height: 600px) {
    body { justify-content: center; background: #07060c; }
    .app {
      flex: none; width: 390px; height: min(844px, calc(100vh - 32px)); margin: 16px auto;
      border-radius: 40px; border: 10px solid #15121f;
      box-shadow: 0 30px 90px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
    .scroller::-webkit-scrollbar { display: none; }
  }
  .screen { display: none; flex: 1; flex-direction: column; animation: fadeIn 0.25s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 40px; margin: 8px 0 2px; text-align: center; letter-spacing: -1px; }
  h1 .odd { color: var(--odd); } h1 .even { color: var(--even); }
  .tagline { color: var(--muted); text-align: center; margin: 0 0 14px; font-size: 15px; }
  h2 { font-size: 20px; margin: 8px 0 12px; text-align: center; }
  .sub { color: var(--muted); font-size: 14px; text-align: center; margin: 0 0 12px; }

  /* 버튼 */
  button {
    font-family: inherit; font-size: 18px; font-weight: 700; color: var(--text);
    background: var(--card); border: 2px solid #3a3360; border-radius: 16px;
    padding: 16px 20px; cursor: pointer; width: 100%;
    transition: transform 0.08s, filter 0.15s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: default; transform: none; }
  button.primary { background: var(--gold); color: #2b2000; border-color: var(--gold); }
  button.ghost { background: transparent; border-color: #3a3360; color: var(--muted); font-size: 15px; padding: 12px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }

  /* 타이틀 메뉴 버튼 (홀/짝 버튼처럼 반투명) */
  .menu { font-size: 20px; padding: 11px 14px; border-width: 3px; line-height: 1.2; }
  .menu small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 3px; }
  #title-dosa { margin-top: 4px; }
  #title-dosa .portrait { width: 200px; }
  #title-dosa::before { width: 200px; height: 200px; }
  #s-title .stack { gap: 8px; }
  .menu.dice { border-color: var(--gold); color: var(--gold); background: rgba(243,201,105,0.1); }
  .menu.arrow { border-color: var(--odd); color: var(--odd); background: rgba(255,107,107,0.1); }
  .menu.timer { border-color: var(--even); color: var(--even); background: rgba(90,169,255,0.1); }
  .menu.sticks { border-color: var(--win); color: var(--win); background: rgba(88,214,141,0.1); }

  /* 젓가락 뽑기: 대나무 통 + 젓가락 */
  /* 결과 버튼 두 개가 생겨도 프레임 안에 들어가도록 이 화면은 도사와 통을 조금 작게 */
  #sk-dosa { margin-top: 2px; }
  #sk-dosa .portrait { width: 196px; }
  #sk-dosa::before { width: 196px; height: 196px; }
  .cup-wrap { position: relative; width: 100%; max-width: 330px; height: 296px; margin: 0 auto; }
  /* 얇고 긴 통. 폭(--cw)은 인원수에 맞춰 JS가 정한다 */
  .cup { --cw: 120px; position: absolute; left: 50%; bottom: 4px; width: var(--cw); height: 168px; margin-left: calc(var(--cw) / -2); z-index: 3; }
  .cup-body {
    position: absolute; inset: 11px 0 0 0; border-radius: 12px 12px 34px 34px / 12px 12px 26px 26px;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 34px, rgba(60,35,10,0.35) 34px 38px),
      linear-gradient(90deg, #5c3d1f 0%, #9a6b35 22%, #d1a66a 50%, #9a6b35 78%, #5c3d1f 100%);
    border: 2px solid #3a2410; box-shadow: 0 16px 24px rgba(0,0,0,0.55), inset 0 -10px 20px rgba(0,0,0,0.3);
  }
  .cup-top {
    position: absolute; left: 0; right: 0; top: 0; height: 22px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%, #241406, #4a2f14 70%); border: 2px solid #a37c48;
  }
  .stick-box { position: absolute; left: 50%; bottom: 144px; width: 0; height: 0; z-index: 2; }
  /* 각 젓가락은 통 위에서 가로 위치(--x)와 기울기(--r)가 달라 서로 떨어져 있다 */
  .stick {
    position: absolute; left: var(--x, 0px); bottom: 0; width: 14px; height: 136px; margin-left: -7px; padding: 0;
    border-radius: 8px 8px 4px 4px; border: 1px solid #7a5a30;
    background: linear-gradient(90deg, #c9a06a, #f0d7a8 45%, #b88b52);
    transform-origin: 50% 100%; transform: rotate(var(--r)) translateY(0);
    transition: transform 0.55s cubic-bezier(.2,1.25,.4,1), opacity 0.4s, filter 0.3s;
    cursor: pointer; box-shadow: 2px 0 4px rgba(0,0,0,0.35);
  }
  .stick:active { transform: rotate(var(--r)) translateY(-8px); filter: brightness(1.15); }
  .stick span {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    writing-mode: vertical-rl; font-size: 12px; font-weight: 900; white-space: nowrap; letter-spacing: 1px;
    opacity: 0; transition: opacity 0.3s 0.25s;
  }
  .stick.drawn { transform: rotate(var(--r)) translateY(-112px); z-index: 10; }
  .stick.drawn span { opacity: 1; }
  .stick.hit { background: linear-gradient(90deg, #d8b37a, #fff0c8 45%, #caa062); box-shadow: 0 0 18px rgba(255,92,92,0.8), 2px 0 4px rgba(0,0,0,0.35); }
  .stick.hit span { color: #b3121c; }
  .stick.safe span { color: #1e7a45; }
  .stick.spent { opacity: 0.35; transform: rotate(var(--r)) translateY(-112px) scale(0.92); pointer-events: none; }
  .stick.locked { pointer-events: none; filter: saturate(0.5) brightness(0.8); }
  .reveal { position: absolute; left: 0; right: 0; top: 0; z-index: 20; text-align: center; pointer-events: none; }
  .reveal .card {
    display: inline-block; padding: 12px 18px; border-radius: 16px; font-weight: 900; font-size: 20px;
    background: rgba(18,16,28,0.85); border: 2px solid var(--win); color: var(--win); animation: pop 0.35s cubic-bezier(.2,1.4,.5,1);
  }
  .reveal .card.hit { border-color: var(--lose); color: var(--lose); font-size: 26px; box-shadow: 0 0 30px rgba(255,92,92,0.5); }

  /* 시간 초 맞추기 */
  .tm-display {
    font-size: 78px; font-weight: 900; text-align: center; line-height: 1; margin: 4px 0 0;
    font-variant-numeric: tabular-nums; letter-spacing: -1px; text-shadow: 0 4px 18px rgba(0,0,0,0.6);
  }
  .tm-display.run { color: var(--even); }
  .tm-display.done { color: var(--gold); }
  .tm-target { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 6px; }
  .tm-target b { color: var(--text); }
  .tm-btn.stop { border-color: var(--lose); color: var(--lose); background: rgba(255,92,92,0.14); }

  /* 화살표 룰렛: 축(꼬리 끝)이 wheel의 정중앙에 오고, 화살표 길이는 화면 폭에 맞춰 JS가 정한다 */
  .wheel { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto; }
  .spinner { position: absolute; left: 50%; top: 50%; will-change: transform; }
  #arrow-img { display: block; max-width: none; height: auto; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6)); }
  .dosa.small { width: 180px; margin-top: 4px; }
  .dosa.small .portrait { width: 165px; }
  .dosa.small::before { width: 180px; height: 180px; }
  .hub {
    position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; padding: 0;
    border-radius: 50%; border: 3px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.14);
    color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 0 0 8px rgba(255,255,255,0.06), 0 8px 20px rgba(0,0,0,0.5);
  }
  .hub:disabled { opacity: 0.6; }

  .choice { font-size: 34px; padding: 22px 10px; border-width: 3px; }
  .choice.odd { border-color: var(--odd); color: var(--odd); background: rgba(255,107,107,0.08); }
  .choice.even { border-color: var(--even); color: var(--even); background: rgba(90,169,255,0.08); }
  .choice small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }

  /* 도사 */
  .stage { display: flex; flex-direction: column; align-items: center; margin: 8px 0 12px; }
  .bubble {
    position: relative; background: #fff8e8; color: #2b2000; border-radius: 18px;
    padding: 14px 18px; font-size: 17px; font-weight: 600; line-height: 1.45;
    max-width: 100%; min-height: 56px; text-align: center; width: 100%;
    animation: pop 0.25s ease;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
    border: 10px solid transparent; border-top-color: #fff8e8; border-bottom: 0;
  }
  @keyframes pop { from { transform: scale(0.92); opacity: 0.4; } to { transform: none; opacity: 1; } }

  .dosa { position: relative; margin-top: 14px; width: 250px; display: flex; flex-direction: column; align-items: center; }
  /* 뒤에서 은은하게 비추는 빛 */
  .dosa::before {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 240px; height: 240px; border-radius: 50%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(243,201,105,0.32), rgba(243,201,105,0.08) 45%, transparent 68%);
    transition: background 0.3s;
  }
  .dosa.happy::before { background: radial-gradient(circle, rgba(88,214,141,0.45), rgba(88,214,141,0.1) 45%, transparent 68%); }
  .dosa.evil::before { background: radial-gradient(circle, rgba(255,92,92,0.45), rgba(255,92,92,0.1) 45%, transparent 68%); }
  .portrait {
    position: relative; z-index: 1; width: 236px; height: auto; display: block;
    aspect-ratio: 779 / 800; object-fit: contain; object-position: center bottom;   /* 표정 그림 비율이 달라도 자리가 흔들리지 않게 */
    filter: drop-shadow(0 18px 16px rgba(0,0,0,0.6)) drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    transform-origin: 50% 95%;
    animation: float 3.4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50% { transform: translateY(-7px) rotate(1.2deg); }
  }
  .dosa.happy .portrait { animation: hop 0.55s ease; }
  .dosa.evil .portrait { animation: wobble 0.55s ease; }
  @keyframes hop { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-18px) scale(1.07); } 70% { transform: translateY(2px) scale(0.98); } 100% { transform: translateY(0) scale(1); } }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 50% { transform: rotate(6deg); } 75% { transform: rotate(-3deg); } }

  /* ---- 주사위 ---- */
  .arena {
    position: relative; z-index: 2; width: 100%; max-width: 300px; height: 118px; margin: -22px auto 0;
  }
  .floor {
    position: absolute; left: 6%; right: 6%; bottom: 10px; height: 26px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(243,201,105,0.22), rgba(243,201,105,0.05) 55%, transparent 72%);
  }
  /* 주사위는 WebGL 캔버스에 픽셀 단위로 그린다 (둥근 상자 레이마칭). 캔버스는 여유 있게 잡고 그 안에 주사위가 그려진다 */
  .die {
    --s: 80px; position: absolute; bottom: 2px; width: var(--s); height: var(--s);
    will-change: transform;
  }
  .die.a { left: calc(20% - 15px); } .die.b { left: calc(62% - 15px); }
  .shadow {
    position: absolute; bottom: 12px; width: 60px; height: 16px; border-radius: 50%; margin-left: -5px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.6), transparent 70%); opacity: 0.6;
  }
  .shadow.a { left: 20%; } .shadow.b { left: 62%; }
  .body { position: absolute; inset: 0; }
  .die canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .result {
    text-align: center; font-size: 28px; font-weight: 800; min-height: 40px; margin: 6px 0 10px;
  }
  .result.win { color: var(--win); } .result.lose { color: var(--lose); }
  .result .num { font-size: 15px; color: var(--muted); font-weight: 500; display: block; margin-top: 2px; }

  .status { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 4px 2px 10px; }
  .status b { color: var(--text); }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 2px 0 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3a3360; }
  .dot.win { background: var(--win); } .dot.lose { background: var(--lose); }

  /* 설정 화면 */
  .label { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.5px; margin: 18px 0 8px; }
  .label:first-child { margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    width: auto; font-size: 15px; padding: 9px 14px; border-radius: 999px; border-width: 2px; font-weight: 600;
  }
  .chip.on { background: var(--gold); color: #2b2000; border-color: var(--gold); }
  .chip.dice { color: var(--gold); }
  .seg { display: flex; gap: 8px; }
  .seg button { font-size: 15px; padding: 12px 8px; line-height: 1.3; }
  .seg button small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 3px; }
  .seg button.on { border-color: var(--gold); background: rgba(243,201,105,0.12); }
  .seg button.on small { color: var(--text); }
  .roll-btn { font-size: 26px; padding: 22px; border-width: 3px; border-color: var(--gold); color: var(--gold); background: rgba(243,201,105,0.08); }

  /* 최종 결과 */
  .final { text-align: center; margin: 10px 0 6px; }
  .final .stake { color: var(--muted); font-size: 17px; }
  .final .who { font-size: 48px; font-weight: 900; color: var(--gold); line-height: 1.15; margin: 8px 0 4px; word-break: keep-all; animation: pop 0.4s cubic-bezier(.2,1.4,.5,1); }
  .final .verb { font-size: 26px; font-weight: 800; }
  .final.winner .who { color: var(--win); }
  .final .among { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .cf { position: absolute; top: -14px; width: 9px; height: 15px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(900px) rotate(720deg); opacity: 0.6; } }
  .toast {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); background: #fff8e8; color: #2b2000;
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 60; animation: pop 0.25s ease;
  }

  /* 전적 */
  .hist-rank { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 14px; }
  .hist-rank .brow { padding: 9px 14px; }
  .hist-rank .cnt { font-weight: 800; color: var(--lose); }
  .hist-rank .cnt.w { color: var(--win); }
  .hist-list { display: flex; flex-direction: column; gap: 4px; }
  .hist-list div { color: var(--muted); font-size: 14px; padding: 6px 2px; border-bottom: 1px solid #2b2546; }
  .hist-list b { color: var(--text); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }

  /* 입력 */
  input[type=text], input[type=number] {
    font-family: inherit; font-size: 17px; color: var(--text); background: var(--card);
    border: 2px solid #3a3360; border-radius: 12px; padding: 12px 14px; width: 100%; outline: none;
  }
  input:focus { border-color: var(--gold); }
  .names { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .names input { padding: 10px 14px; font-size: 16px; }
  .stepper { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 8px 0; }
  .stepper button { width: 56px; padding: 10px; font-size: 24px; }
  .stepper span { font-size: 28px; font-weight: 800; min-width: 60px; text-align: center; }

  .turn { text-align: center; margin: 0 0 10px; }
  .turn .name { font-size: 30px; font-weight: 900; color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  .turn .hint { color: var(--muted); font-size: 14px; }
  /* 플레이 화면: 도사와 주사위를 위로 바짝 */
  .stage.play { margin: 0 0 4px; }
  .stage.play .dosa { margin-top: 6px; }
  .stage.play + .result { margin-top: 0; }

  .board { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .brow {
    display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 10px 14px;
    border-left: 5px solid #3a3360;
  }
  .brow.win { border-left-color: var(--win); } .brow.lose { border-left-color: var(--lose); }
  .brow .n { font-weight: 700; flex: 1; }
  .brow .pick { color: var(--muted); font-size: 14px; }
  .brow .mark { font-size: 20px; }
  .brow.cand { border-left-color: var(--gold); background: rgba(243,201,105,0.1); }
  .verdict {
    background: linear-gradient(135deg, #5a1f2a, #3a1430); border: 2px solid var(--lose);
    border-radius: 16px; padding: 16px; text-align: center; font-size: 18px; font-weight: 700; line-height: 1.5; margin: 8px 0;
  }
  .verdict.tie { background: linear-gradient(135deg, #4a3a10, #2f2410); border-color: var(--gold); }
  .verdict.big { font-size: 22px; padding: 20px 16px; border-width: 3px; box-shadow: 0 0 30px rgba(255,92,92,0.35); animation: pop 0.4s cubic-bezier(.2,1.4,.5,1); }
  .verdict.big .who { font-size: 44px; font-weight: 900; color: var(--lose); line-height: 1.1; margin-bottom: 6px; text-shadow: 0 3px 12px rgba(0,0,0,0.6); }
  .brow.worst { padding: 14px; font-size: 18px; border-left-width: 8px; background: rgba(255,92,92,0.16); }
  .brow.worst .n { font-size: 20px; color: var(--lose); }
  .verdict.none { background: linear-gradient(135deg, #1f4d35, #143a30); border-color: var(--win); }
  .footer { margin-top: auto; padding-top: 16px; }
</style>
</head>
<body>
<div class="app"><div class="scroller">

  <!-- 타이틀 -->
  <section class="screen active" id="s-title">
    <h1><span class="odd">홀</span><span class="even">짝</span> 도사</h1>
    <p class="tagline">누가 쏠지, 주사위로 정하자.</p>
    <div class="stage">
      <div class="bubble" id="title-bubble">누가 쌈뽕하게 쏠지 내가 정해 주마,, ㅋ</div>
      <div class="dosa" id="title-dosa"><img class="portrait" id="title-portrait" alt="홀짝 도사"></div>
    </div>
    <div class="stack footer">
      <button class="menu dice" onclick="openCount('dice')">🎲 홀짝 주사위<small>순서대로 한 번씩 던진다. 틀린 사람이 쏜다</small></button>
      <button class="menu arrow" onclick="openArrow()">➡️ 화살표 술겜<small>돌다가 멈춘 화살표가 가리키는 사람</small></button>
      <button class="menu timer" onclick="openCount('timer')">⏱️ 시간 초 맞추기<small>랜덤 목표 초(3~8초)에 가장 가까운 사람이 이긴다</small></button>
      <button class="menu sticks" onclick="openCount('sticks')">🥢 젓가락 뽑기<small>"주인공은 너야 너"를 뽑으면 쏜다</small></button>
    </div>
  </section>

  <!-- 인원수 -->
  <section class="screen" id="s-count">
    <h2>몇 명이서 할까?</h2>
    <div class="stage">
      <div class="bubble" id="count-bubble">1번부터 순서대로 한 번씩 던진다. 다 던지면 결과를 보여 주마.</div>
      <div class="dosa"><img class="portrait" id="count-portrait" alt="홀짝 도사"></div>
    </div>
    <div class="stepper">
      <button onclick="changeCount(-1)">−</button>
      <span id="count">4</span>
      <button onclick="changeCount(1)">+</button>
    </div>
    <p class="sub">명</p>
    <div class="stack footer">
      <button class="primary" id="count-start" onclick="countStart()">시작하기</button>
      <button class="ghost" onclick="quitToTitle()">뒤로</button>
    </div>
  </section>

  <!-- 시간 초 맞추기 -->
  <section class="screen" id="s-timer">
    <div class="status"><span>⏱️ 시간 초 맞추기</span><span id="tm-right"></span></div>
    <div class="stage play">
      <div class="bubble" id="tm-bubble">…</div>
      <div class="dosa" id="tm-dosa"><img class="portrait" id="tm-portrait" alt="홀짝 도사"></div>
    </div>
    <div class="tm-display" id="tm-display">0.00</div>
    <div class="tm-target">목표 <b id="tm-target">4.00</b>초</div>
    <div class="result" id="tm-result"></div>
    <div class="turn"><div class="name" id="tm-name"></div><div class="hint" id="tm-hint">차례! 시작을 누르고 4초에 멈춰라.</div></div>
    <button class="roll-btn tm-btn" id="tm-btn" onclick="timerBtn()">▶ 시작</button>
    <div class="stack footer">
      <button class="primary" id="tm-next" style="display:none" onclick="timerNext()">다음</button>
      <button class="ghost" onclick="quitToTitle()">그만두기</button>
    </div>
  </section>

  <!-- 플레이 화면 -->
  <section class="screen" id="s-play">
    <div class="status"><span id="st-left"></span><span id="st-right"></span></div>
    <div class="stage play">
      <div class="bubble" id="bubble">…</div>

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
  const sc = document.querySelector('.scroller'); if (sc) sc.scrollTo(0, 0);
}
function randInt(min, max) { // 공정한 난수 (crypto)
  const range = max - min + 1;
  const buf = new Uint32Array(1);
  const limit = Math.floor(0x100000000 / range) * range;
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
  return min + (x % range);
}
const pickOne = arr => arr[randInt(0, arr.length - 1)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

function setMood(el, m) {

/* ---------- 주사위 (WebGL 레이마칭) ----------
   면을 이어 붙인 CSS 큐브는 어떤 각도에서든 이음새가 보이므로, 주사위를 셰이더로 직접 그린다.
   둥근 상자 거리함수(SDF)를 레이마칭해 이음새 없는 한 덩어리 실루엣을 만들고,
   눈은 같은 반지름의 구를 표면에서 파낸 홈이라 규격이 모두 같다. */

// 좌표계: x 오른쪽, y 위, z 화면 앞. 주사위 로컬 기준 +z면=1, -z=6, +x=3, -x=4, +y=5, -y=2 (마주보는 면 합 7)
// 각 눈이 정면(+z)에 오도록 하는 회전값 [rx, ry]
const FACE_ROT = { 1: [0, 0], 6: [0, 180], 3: [0, -90], 4: [0, 90], 5: [90, 0], 2: [-90, 0] };

// 멈췄을 때의 자세: 결과 눈이 정면을 똑바로 보는 2D 자세 (0,0). 값을 주면 옆면이 보이는 입체 자세가 된다.
const REST_TILT = { x: 0, y: 0 };
const restPose = (value, dir, rz) => ({ vx: REST_TILT.x, vy: -dir * REST_TILT.y, rz, rx: FACE_ROT[value][0], ry: FACE_ROT[value][1] });

const DIE_VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
const DIE_FS = `
precision highp float;
uniform mat3 uInv;      // 월드 → 주사위 로컬 (회전의 역행렬)
uniform vec2 uRes;
const float B = 1.0;    // 주사위 반폭
const float R = 0.42;   // 모서리 둥글기 (클수록 동글동글)
const float S = 0.5;    // 눈 간격
const float PR = 0.2;   // 눈 반지름 (모든 눈 동일)

float sdRoundBox(vec3 p) { vec3 q = abs(p) - vec3(B - R); return length(max(q, 0.0)) - R; }

bool pipOn(int v, int i, int j) {
  if (v == 1) return i == 0 && j == 0;
  if (v == 2) return (i == -1 && j == -1) || (i == 1 && j == 1);
  if (v == 3) return i == j;
  if (v == 4) return i != 0 && j != 0;
  if (v == 5) return (i != 0 && j != 0) || (i == 0 && j == 0);
  return i != 0;                      // 6: 두 줄
}
// 가장 가까운 면의 눈(구)까지의 거리
float sdPips(vec3 p) {
  vec3 a = abs(p); int v; vec2 uv;
  if (a.z >= a.x && a.z >= a.y) { v = p.z > 0.0 ? 1 : 6; uv = p.xy; }
  else if (a.x >= a.y)          { v = p.x > 0.0 ? 3 : 4; uv = p.zy; }
  else                          { v = p.y > 0.0 ? 5 : 2; uv = p.xz; }
  float depth = max(a.x, max(a.y, a.z));
  float dmin = 1e3;
  for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) {
    if (!pipOn(v, i, j)) continue;
    vec3 c = vec3(float(i) * S, float(j) * S, B + PR * 0.55);   // 중심을 표면 살짝 위에 두면 얕은 홈이 된다
    dmin = min(dmin, length(vec3(uv, depth) - c) - PR);
  }
  return dmin;
}
float map(vec3 p) { return max(sdRoundBox(p), -sdPips(p)); }

void main() {
  vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  vec3 ro = uInv * vec3(0.0, 0.0, 4.2);
  vec3 rd = uInv * normalize(vec3(uv * 0.44, -1.0));   // 값이 클수록 주사위가 작게 보인다
  float t = 2.3, dmin = 1e3, d = 0.0;
  for (int i = 0; i < 90; i++) {
    d = map(ro + rd * t); dmin = min(dmin, d);
    if (d < 0.0008 || t > 6.5) break;
    t += d;
  }
  float px = (2.0 / uRes.y) * 1.85;                   // 화면 한 픽셀의 월드 크기 (가장자리 안티앨리어싱용)
  float alpha = 1.0 - smoothstep(0.0, px, dmin);
  if (alpha < 0.003) discard;
  vec3 p = ro + rd * t;
  vec2 e = vec2(0.0015, 0.0);
  vec3 n = normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx)));
  float pipK = smoothstep(-px * 0.8, px * 0.8, -sdPips(p) - sdRoundBox(p));   // 홈 영역이면 1
  vec3 L = normalize(uInv * vec3(-0.45, 0.75, 0.65));
  vec3 V = -rd, H = normalize(L + V);
  float dif = clamp(dot(n, L), 0.0, 1.0);
  float spec = pow(clamp(dot(n, H), 0.0, 1.0), 40.0);
  float rim = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.0);
  vec3 body = vec3(0.985, 0.975, 0.95) * (0.46 + 0.6 * dif) + spec * 0.32 + rim * 0.06;
  vec3 pip  = vec3(0.075, 0.075, 0.09) * (0.5 + 0.9 * dif) + spec * 0.18;
  vec3 col = mix(body, pip, pipK);
  gl_FragColor = vec4(col * alpha, alpha);
}`;

function makeDieRenderer(canvas) {
  const gl = canvas.getContext('webgl', { alpha: true, antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: true });
  if (!gl) return null;
  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, DIE_VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, DIE_FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return null; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  const uInv = gl.getUniformLocation(prog, 'uInv');
  gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), canvas.width, canvas.height);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  return {
    render(m) {           // m: 행우선 회전행렬 M. 열우선으로 읽히므로 셰이더에는 Mᵀ(역행렬)가 들어간다
      gl.uniformMatrix3fv(uInv, false, m);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    },
  };
}
// WebGL이 없을 때: 정면 눈만 2D로 그린다
function drawDie2D(canvas, value) {
  const ctx = canvas.getContext('2d'), w = canvas.width, s = w * 0.66, o = (w - s) / 2, r = s * 0.3;
  ctx.clearRect(0, 0, w, w);
  ctx.fillStyle = '#f5f3ee'; ctx.beginPath(); ctx.roundRect(o, o, s, s, r); ctx.fill();
  const cells = { 1: [[0, 0]], 2: [[-1, -1], [1, 1]], 3: [[-1, -1], [0, 0], [1, 1]], 4: [[-1, -1], [1, -1], [-1, 1], [1, 1]], 5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]], 6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]] };
  ctx.fillStyle = '#111';
  cells[value].forEach(([i, j]) => { ctx.beginPath(); ctx.arc(w / 2 + i * s * 0.25, w / 2 + j * s * 0.25, s * 0.1, 0, Math.PI * 2); ctx.fill(); });
}

// 3x3 행렬(행우선) 유틸
const D2R = Math.PI / 180;
const M3 = {
  mul(A, Bm) { const C = new Array(9); for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) C[r * 3 + c] = A[r * 3] * Bm[c] + A[r * 3 + 1] * Bm[3 + c] + A[r * 3 + 2] * Bm[6 + c]; return C; },
  rx(a) { const c = Math.cos(a * D2R), s = Math.sin(a * D2R); return [1, 0, 0, 0, c, -s, 0, s, c]; },
  ry(a) { const c = Math.cos(a * D2R), s = Math.sin(a * D2R); return [c, 0, s, 0, 1, 0, -s, 0, c]; },
  rz(a) { const c = Math.cos(a * D2R), s = Math.sin(a * D2R); return [c, -s, 0, s, c, 0, 0, 0, 1]; },
};
// 자세 → 회전행렬: M = Rx(vx)·Ry(vy)·Rz(rz)·Rx(rx)·Ry(ry)
const poseMatrix = p => M3.mul(M3.rx(p.vx), M3.mul(M3.ry(p.vy), M3.mul(M3.rz(p.rz), M3.mul(M3.rx(p.rx), M3.ry(p.ry)))));

/* WebGL 컨텍스트는 브라우저당 개수 제한이 있어(대략 16개) 주사위마다 만들면 오래된 것부터 사라진다.
   그래서 숨겨진 WebGL 캔버스 하나로만 그리고, 각 주사위의 2D 캔버스에는 그 결과를 복사한다. */
const DIE_PX = Math.round(80 * Math.min(2, window.devicePixelRatio || 1));
const DieGL = (() => {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = DIE_PX;
  let renderer = makeDieRenderer(canvas);
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); renderer = null; });
  canvas.addEventListener('webglcontextrestored', () => { renderer = makeDieRenderer(canvas); });
  return { canvas, get ok() { return !!renderer; }, render(m) { renderer.render(m); } };
})();

function buildDie(arena, key, rest) {
  const sh = document.createElement('div'); sh.className = 'shadow ' + key; arena.appendChild(sh);
  const die = document.createElement('div'); die.className = 'die ' + key;
  const body = document.createElement('div'); body.className = 'body';
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = DIE_PX;
  body.appendChild(canvas); die.appendChild(body); arena.appendChild(die);
  const d = { die, shadow: sh, canvas, ctx: canvas.getContext('2d'), value: rest, dir: key === 'a' ? 1 : -1 };
  resetDie(d, rest);
  return d;
}
function resetDie(d, rest) {
  d.value = rest;
  d.die.style.transform = ''; d.shadow.style.transform = ''; d.shadow.style.opacity = '';
  setPose(d, restPose(rest, d.dir, randInt(-14, 14)));
}
function setPose(d, p) {
  if (DieGL.ok) {
    DieGL.render(new Float32Array(poseMatrix(p)));
    d.ctx.clearRect(0, 0, DIE_PX, DIE_PX);
    d.ctx.drawImage(DieGL.canvas, 0, 0);
  } else drawDie2D(d.canvas, d.value);
}
// 무대의 주사위는 한 번만 만들고, 이후에는 자세만 초기화해서 재사용한다
function buildArena(arena) {
  if (!arena._dice) arena._dice = { a: buildDie(arena, 'a', randInt(1, 6)), b: buildDie(arena, 'b', randInt(1, 6)) };
  else { resetDie(arena._dice.a, randInt(1, 6)); resetDie(arena._dice.b, randInt(1, 6)); }
  return arena._dice;
}

/* 주사위 물리 시뮬레이션
   중력으로 떨어져 바닥에 닿으면 반발계수만큼만 튀어오르고(점점 낮게·빠르게),
   튈 때마다 회전과 미끄러짐이 줄어들다가 마지막엔 목표 눈이 정면이 되도록 가라앉는다.
   단위: px, 초, 도 */
const rnd = (a, b) => a + (randInt(0, 10000) / 10000) * (b - a);
const nearestAngle = (cur, target, w) => {
  let delta = ((target - cur) % 360 + 540) % 360 - 180;      // -180 ~ 180
  if (Math.abs(w) > 150 && Math.sign(delta) !== Math.sign(w)) delta += 360 * Math.sign(w); // 돌던 방향으로 계속
  return cur + delta;
};
function simulateThrow(value, dir) {
  const dt = 1 / 120, g = 3200;
  const s = { x: 0, h: 170, vx: rnd(220, 290) * dir, vh: rnd(140, 230),
              rx: rnd(0, 360), ry: rnd(0, 360), rz: rnd(-40, 40), vX: 0, vY: 0,
              wx: rnd(650, 1050) * (randInt(0, 1) ? 1 : -1), wy: rnd(450, 800) * (randInt(0, 1) ? 1 : -1), wz: rnd(-260, 260) };
  const frames = [], bounces = [];
  const [tx, ty] = FACE_ROT[value], tz = rnd(-22, 22);
  let t = 0, settle = null;
  while (t < 4) {
    if (!settle) {
      s.vh -= g * dt; s.h += s.vh * dt; s.x += s.vx * dt;
      s.rx += s.wx * dt; s.ry += s.wy * dt; s.rz += s.wz * dt;
      if (s.h <= 0) {                                     // 바닥 충돌
        s.h = 0;
        const e = rnd(0.46, 0.6);                         // 반발계수
        s.vh = -s.vh * e;
        s.vx *= rnd(0.65, 0.8);                           // 바닥 마찰로 미끄러짐 감소
        s.wx = s.wx * rnd(0.5, 0.7) + rnd(-180, 180);     // 회전도 줄고 살짝 흐트러짐
        s.wy = s.wy * rnd(0.5, 0.7) + rnd(-180, 180);
        s.wz = s.wz * 0.5 + rnd(-120, 120);
        bounces.push({ t, strength: Math.min(1, s.vh / 400) });
        if (s.vh < 105) {                                 // 더 못 튀면 가라앉기 시작
          settle = { t0: t, dur: rnd(0.26, 0.34), from: { ...s },
                     to: { x: s.x + s.vx * 0.1, rx: nearestAngle(s.rx, tx, s.wx), ry: nearestAngle(s.ry, ty, s.wy), rz: tz,
                           vX: REST_TILT.x, vY: -dir * REST_TILT.y } };
        }
      }
    } else {
      const p = Math.min(1, (t - settle.t0) / settle.dur), k = 1 - Math.pow(1 - p, 3);   // ease-out
      const f = settle.from, o = settle.to;
      s.x = f.x + (o.x - f.x) * k; s.rx = f.rx + (o.rx - f.rx) * k; s.ry = f.ry + (o.ry - f.ry) * k; s.rz = f.rz + (o.rz - f.rz) * k;
      s.vX = o.vX * k; s.vY = o.vY * k;
      s.h = 0;
      if (p >= 1) { frames.push({ x: s.x, h: 0, rx: s.rx, ry: s.ry, rz: s.rz, vx: s.vX, vy: s.vY }); break; }
    }
    frames.push({ x: s.x, h: s.h, rx: s.rx, ry: s.ry, rz: s.rz, vx: s.vX, vy: s.vY });
    t += dt;
  }
  return { frames, dt, bounces, endX: s.x };
}

// 시뮬레이션 결과를 화면에 재생. 마지막 위치가 제자리(0)가 되도록 시작점을 역산한다.
function playThrow(d, sim, delay) {
  const offset = -sim.endX;
  const apply = f => {
    d.die.style.transform = `translate(${offset + f.x}px, ${-f.h}px)`;
    setPose(d, f);
    const sc = Math.max(0.3, Math.min(1, 1 - f.h / 320));
    d.shadow.style.transform = `translateX(${offset + f.x}px) scale(${sc})`;
    d.shadow.style.opacity = (0.7 * sc).toFixed(2);
  };
  return new Promise(resolve => {
    apply(sim.frames[0]);
    const start = performance.now() + delay;
    let nextBounce = 0;
    const tick = now => {
      const el = Math.max(0, (now - start) / 1000);
      const i = Math.min(sim.frames.length - 1, Math.floor(el / sim.dt));
      apply(sim.frames[i]);
      while (nextBounce < sim.bounces.length && el >= sim.bounces[nextBounce].t) {   // 바닥에 닿는 순간 진동만
        vibrate(Math.round(15 + 35 * sim.bounces[nextBounce].strength));
        nextBounce++;
      }
      if (i >= sim.frames.length - 1) resolve(); else requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ---------- 한글 조사 ---------- */
const hasBatchim = s => { const c = s.charCodeAt(s.length - 1); return c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 !== 0 : false; };
const josa = (s, a, b) => s + (hasBatchim(s) ? a : b);   // josa('철수','이','가') → 철수가
const fill = (line, p) => line.replace('{n}', p.n || '').replace('{st}', p.st || '').replace('{s}', p.s ?? '');

/* ---------- 홀짝 주사위: 인원수만 정하고 1번부터 순서대로 한 번씩 던진 뒤 결과를 본다 ---------- */
const cfg = { mode: 'oddeven', count: 4 };
const game = { busy: false, dice: null, turn: 0, picks: [], prompt: null };

// 인원수 화면은 주사위·시간 초 맞추기가 함께 쓴다
const GAMES = {
  dice: { intro: '1번부터 순서대로 한 번씩 던진다. 다 던지면 결과를 보여 주마.', label: '주사위 굴리러 가기', start: () => startDice() },
  timer: { intro: '목표 초는 3~8초 중에서 내가 정한다. 1번부터 차례로 시작을 누르고 목표에 맞춰 멈춰라.', label: '시작하기', start: () => startTimer() },
  sticks: { intro: '통에 사람 수만큼 젓가락을 꽂아 두마. 하나는 주인공이다. 주인공이 나오면 그 자리에서 끝.', label: '젓가락 꽂기', start: () => startSticks() },
};
let current = GAMES.dice;
function openCount(key) {
  current = GAMES[key] || GAMES.dice;
  const saved = load('hj_count'); if (saved >= 2 && saved <= 10) cfg.count = saved;
  $('count').textContent = cfg.count;
  $('count-bubble').textContent = current.intro;
  $('count-start').textContent = current.label;
  show('s-count');
}
function countStart() { store('hj_count', cfg.count); current.start(); }
function playAgain() { current.start(); }
function changeCount(d) {
  cfg.count = Math.max(2, Math.min(10, cfg.count + d));
  $('count').textContent = cfg.count;
  vibrate(10);
}
function startDice() {
  store('hj_count', cfg.count);
  game.turn = 0; game.picks = [];
  $('st-left').innerHTML = '🎲 홀짝 주사위';
  show('s-play');
  newTurn();
}
function newTurn() {
  $('turn-name').textContent = `${game.turn + 1}번`;
  $('st-right').textContent = `${game.turn + 1} / ${cfg.count}`;
  resetHand(); setControls(true);
  let p; do { p = pickOne(LINES.turnOdd); } while (p === game.prompt);   // 직전과 같은 멘트는 피한다
  game.prompt = p;
  say(p.q);
}
function resetHand() {
  game.dice = buildArena($('arena'));
  $('result').textContent = ''; $('result').className = 'result';
  mood('');
}
function setControls(enabled) {
  $('choices').style.display = enabled ? '' : 'none';
  document.querySelectorAll('#choices button').forEach(b => b.disabled = false);
  $('next-btn').style.display = enabled ? 'none' : '';
}
async function roll(choice) {
  if (game.busy) return;
  game.busy = true;
  document.querySelectorAll('#choices button').forEach(b => b.disabled = true);
  resetHand();
  say(pickOne(LINES.shake));

  const d1 = randInt(1, 6), d2 = randInt(1, 6), sum = d1 + d2;
  const actual = sum % 2 === 1 ? 'odd' : 'even';
  const correct = actual === choice;

  await Promise.all([
    playThrow(game.dice.a, simulateThrow(d1, 1), 0),
    playThrow(game.dice.b, simulateThrow(d2, -1), 130),
  ]);
  await sleep(180);

  const r = $('result');
  r.className = 'result ' + (correct ? 'win' : 'lose');
  r.innerHTML = (correct ? '정답! ' : '땡! ') + (actual === 'odd' ? '홀' : '짝')
    + `<span class="num">🎲 ${d1} + ${d2} = ${sum} · 너는 ${choice === 'odd' ? '홀' : '짝'}</span>`;
  document.body.classList.add(correct ? 'flash-win' : 'flash-lose');
  setTimeout(() => document.body.classList.remove('flash-win', 'flash-lose'), 600);
  vibrate(correct ? [80] : [40, 40, 120]);

  mood(correct ? 'happy' : 'evil');
  say(correct ? game.prompt.win : game.prompt.lose);
  game.picks.push({ no: game.turn + 1, choice, correct, dice: [d1, d2], sum });
  game.turn += 1;
  game.busy = false;
  setControls(false);
  $('next-btn').textContent = game.turn >= cfg.count ? '결과 보기' : `다음: ${game.turn + 1}번 차례`;
}
function nextStep() { if (game.turn >= cfg.count) showBoard(); else newTurn(); }

const BOARD_LINES = {
  some: ['틀린 자, 지갑을 열어라.', '주사위는 정직하다. 자, 쏘거라.', '운 없는 자들이여, 오늘은 네 차례다.'],
  all: ['전원 오답이라니… 내가 다 민망하구나. 다 같이 쏘거라.', '허허허! 한 명도 못 맞혔다. 전원 벌주!'],
  none: ['전원 정답?! 이런 날도 있군. 다 같이 건배!', '모두 맞혔다. 오늘은 아무도 안 쏜다. 허허.'],
};
function showBoard() {
  const losers = game.picks.filter(p => !p.correct);
  const board = $('board'); board.innerHTML = '';
  game.picks.forEach(p => {
    const row = document.createElement('div');
    row.className = 'brow ' + (p.correct ? 'win' : 'lose');
    row.innerHTML = `<span class="n">${p.no}번</span><span class="pick">${p.choice === 'odd' ? '홀' : '짝'} · 🎲 ${p.dice[0]}+${p.dice[1]}=${p.sum}</span><span class="mark">${p.correct ? '⭕' : '❌'}</span>`;
    board.appendChild(row);
  });
  const v = $('b-verdict');
  if (losers.length === 0) {
    say(pickOne(BOARD_LINES.none), 'b-bubble');
    v.innerHTML = '<div class="verdict none">🎉 전원 정답! 아무도 안 쏜다</div>';
  } else if (losers.length === game.picks.length) {
    say(pickOne(BOARD_LINES.all), 'b-bubble');
    v.innerHTML = '<div class="verdict">😵 전원 오답! 다 같이 쏜다</div>';
  } else {
    say(pickOne(BOARD_LINES.some), 'b-bubble');
    v.innerHTML = `<div class="verdict">💸 ${losers.map(p => p.no + '번').join(', ')} 쏜다!</div>`;
  }
  vibrate([50, 50, 50]);
  show('s-board');
}
function quitToTitle() { if (timer.raf) cancelAnimationFrame(timer.raf); timer.running = false; show('s-title'); }

/* ---------- 시간 초 맞추기: 판마다 3~8초 중 랜덤 목표를 정하고, 거기에 가장 가깝게 멈춘 사람이 이긴다 ---------- */
const TIMER_LINES = {
  start: ['시작을 누르고 정확히 {t}초에 멈춰라.', '{t}초다. 속으로 세어 보거라. 하나, 둘… 허허.', '눈 감고 {t}까지 세면 더 잘 된다. 아마도.', '시계 보지 말고 감으로 {t}초를 가거라.'],
  run: ['간다…', '세어라, 세어…', '지금이냐? 아직이냐?'],
  great: ['귀신이냐! 거의 딱이다.', '허허, 몸에 시계가 들었구나.', '이건 반칙 아니냐? 대단하다.'],
  good: ['제법이구나. 감이 좋다.', '오호, 나쁘지 않다.', '쓸 만한 감각이다.'],
  ok: ['음… 그럭저럭이다.', '애매하구나. 다음 사람에게 달렸다.', '조금 아쉽다.'],
  bad: ['시계 좀 사거라.', '쯧쯧, 감이 영 없구나.', '{t}초가 그렇게 어렵더냐? 허허.'],
  board: ['시간 감각의 승자가 가려졌다.', '하늘이 아니라 네 감이 정한 결과다.', '허허, 결과는 이렇다.'],
};
const timer = { turn: 0, results: [], running: false, t0: 0, raf: 0, target: 4 };
function startTimer() {
  timer.turn = 0; timer.results = []; timer.running = false;
  timer.target = randInt(3, 8);                         // 이번 판의 목표 초 (3, 4, 5, 6, 7, 8 중 하나)
  $('tm-target').textContent = timer.target.toFixed(2);
  $('tm-hint').textContent = `차례! 시작을 누르고 ${timer.target}초에 멈춰라.`;
  show('s-timer');
  timerTurn();
}
function timerTurn() {
  $('tm-name').textContent = `${timer.turn + 1}번`;
  $('tm-right').textContent = `${timer.turn + 1} / ${cfg.count}`;
  $('tm-display').textContent = '0.00'; $('tm-display').className = 'tm-display';
  $('tm-result').textContent = ''; $('tm-result').className = 'result';
  const b = $('tm-btn'); b.textContent = '▶ 시작'; b.classList.remove('stop'); b.style.display = '';
  $('tm-next').style.display = 'none';
  setMood($('tm-dosa'), '');
  say(pickOne(TIMER_LINES.start).replace(/\{t\}/g, timer.target), 'tm-bubble');
}
function timerBtn() {
  if (!timer.running) {                     // 시작
    timer.running = true; timer.t0 = performance.now();
    const b = $('tm-btn'); b.textContent = '■ 멈춰!'; b.classList.add('stop');
    $('tm-display').className = 'tm-display run';
    say(pickOne(TIMER_LINES.run), 'tm-bubble');
    vibrate(20);
    const tick = () => {
      if (!timer.running) return;
      $('tm-display').textContent = ((performance.now() - timer.t0) / 1000).toFixed(2);
      timer.raf = requestAnimationFrame(tick);
    };
    timer.raf = requestAnimationFrame(tick);
    return;
  }
  // 멈춤
  const t = (performance.now() - timer.t0) / 1000;
  timer.running = false; cancelAnimationFrame(timer.raf);
  const diff = Math.abs(t - timer.target);
  timer.results.push({ no: timer.turn + 1, t, diff });
  $('tm-display').textContent = t.toFixed(2); $('tm-display').className = 'tm-display done';
  const r = $('tm-result');
  r.className = 'result ' + (diff <= 0.2 ? 'win' : diff <= 0.5 ? '' : 'lose');
  r.innerHTML = `${t < timer.target ? '빨랐다' : t > timer.target ? '늦었다' : '정확!'}<span class="num">목표 ${timer.target.toFixed(2)}초와 차이 ${diff.toFixed(2)}초</span>`;
  const pool = diff <= 0.05 ? TIMER_LINES.great : diff <= 0.2 ? TIMER_LINES.good : diff <= 0.5 ? TIMER_LINES.ok : TIMER_LINES.bad;
  setMood($('tm-dosa'), diff <= 0.2 ? 'happy' : diff > 0.5 ? 'evil' : '');
  say(pickOne(pool).replace(/\{t\}/g, timer.target), 'tm-bubble');
  vibrate(diff <= 0.2 ? [80] : [40, 40, 120]);
  timer.turn += 1;
  $('tm-btn').style.display = 'none';
  const n = $('tm-next'); n.style.display = ''; n.textContent = timer.turn >= cfg.count ? '결과 보기' : `다음: ${timer.turn + 1}번 차례`;
}
function timerNext() { if (timer.turn >= cfg.count) showTimerBoard(); else timerTurn(); }
function showTimerBoard() {
  const sorted = [...timer.results].sort((a, b) => a.diff - b.diff);
  const best = sorted[0], worst = sorted[sorted.length - 1];
  const board = $('board'); board.innerHTML = '';
  // 이긴 순서대로 나열하고, 꼴등만 크게 강조
  sorted.forEach((p, i) => {
    const last = i === sorted.length - 1;
    const row = document.createElement('div');
    row.className = 'brow ' + (last ? 'lose worst' : i === 0 ? 'win' : '');
    row.innerHTML = `<span class="n">${last ? '💸 꼴등' : (i + 1) + '등'} · ${p.no}번</span><span class="pick">${p.t.toFixed(2)}초 · 차이 ${p.diff.toFixed(2)}</span><span class="mark">${i === 0 ? '🏆' : last ? '😵' : ''}</span>`;
    board.appendChild(row);
  });
  say(pickOne(TIMER_LINES.board), 'b-bubble');
  $('b-verdict').innerHTML = `<div class="verdict big"><div class="who">${worst.no}번 꼴등</div>이걸 져버리네 야랄</div>`;
  vibrate([50, 50, 50]);
  show('s-board');
}

/* ---------- 젓가락 뽑기: 통에 인원수만큼 젓가락. "주인공은 너야 너"를 뽑으면 그 사람이 쏘고 바로 끝 ---------- */
const STICK_LINES = {
  start: ['젓가락 {n}개. 하나는 주인공이다. 뽑아라.', '통을 잘 보거라. 다 똑같이 생겼지? 허허.', '손 가는 대로 뽑거라. 운명은 이미 꽂혀 있다.'],
  safe: ['운 좋누. 다음 사람!', '살았구나. 폰 넘겨라.', '허허, 오늘은 네 날이 아니다. 다행이지?', '통과! 다음.'],
  hit: ['주인공은 너야 너! 허허허.', '찾았다, 주인공! 지갑을 열거라.', '오늘의 주인공 등장! 박수!'],
};
const sticks = { hit: -1, drawn: 0, over: false };
function startSticks() {
  const n = cfg.count;
  sticks.hit = randInt(0, n - 1); sticks.drawn = 0; sticks.over = false;
  const box = $('sticks'); box.innerHTML = '';
  // 통 폭은 인원수에 맞추고, 젓가락은 통 위에 가로로 떨어뜨려 꽂은 뒤 바깥쪽일수록 더 기울여 끝이 서로 벌어지게
  const cupW = Math.max(110, n * 16 + 20);
  document.querySelector('.cup').style.setProperty('--cw', cupW + 'px');
  const gap = n > 1 ? (cupW - 30) / (n - 1) : 0;
  const spread = Math.min(44, 8 * (n - 1));
  for (let i = 0; i < n; i++) {
    const b = document.createElement('button'); b.className = 'stick';
    const k = n === 1 ? 0 : i / (n - 1) - 0.5;                     // -0.5 ~ 0.5
    b.style.setProperty('--x', (k * gap * (n - 1)) + 'px');
    b.style.setProperty('--r', (k * spread) + 'deg');
    b.style.zIndex = 2 + Math.round(Math.abs(k) * 10);             // 가운데가 뒤, 바깥이 앞
    b.appendChild(document.createElement('span'));
    b.onclick = () => drawStick(i, b);
    box.appendChild(b);
  }
  $('sk-right').textContent = `0 / ${n}`;
  $('sk-reveal').innerHTML = '';
  $('sk-again').style.display = 'none';
  $('sk-hint').textContent = '폰을 넘겨받고 젓가락 하나를 뽑아라.';
  setMood($('sk-dosa'), '');
  say(pickOne(STICK_LINES.start).replace('{n}', n), 'sk-bubble');
  show('s-sticks');
}
function drawStick(i, el) {
  if (sticks.over || el.classList.contains('drawn')) return;
  const hit = i === sticks.hit;
  // 이전에 뽑힌 젓가락은 옆으로 치운 상태로
  document.querySelectorAll('.stick.drawn').forEach(s => s.classList.add('spent'));
  el.classList.add('drawn', hit ? 'hit' : 'safe');
  el.querySelector('span').textContent = hit ? '주인공은 너야 너' : '운 좋누';
  sticks.drawn += 1;
  $('sk-right').textContent = `${sticks.drawn} / ${cfg.count}`;
  vibrate(hit ? [60, 40, 160] : [40]);
  setTimeout(() => {
    $('sk-reveal').innerHTML = hit ? '<div class="card hit">🥢 주인공은 너야 너!</div>' : '<div class="card">운 좋누 😮‍💨</div>';
    setMood($('sk-dosa'), hit ? 'evil' : 'happy');
    say(pickOne(hit ? STICK_LINES.hit : STICK_LINES.safe), 'sk-bubble');
    if (hit) {
      sticks.over = true;
      document.querySelectorAll('.stick:not(.drawn)').forEach(s => s.classList.add('locked'));
      $('sk-hint').textContent = '주인공이 나왔다. 이 판은 여기서 끝!';
      $('sk-again').style.display = '';
      document.body.classList.add('flash-lose');
      setTimeout(() => document.body.classList.remove('flash-lose'), 700);
    }
  }, 380);
}

/* ---------- 화살표 술겜 ---------- */
const ARROW_LINES = {
  start: ['폰을 가운데 놓고, 화살표 한가운데를 눌러라.', '자, 운명의 화살이다. 가운데를 눌러 보거라.', '누굴 가리킬지는 하늘만 안다. 눌러라.'],
  spin: ['돈다 돈다…', '어디 보자…', '두구두구두구…', '하늘이 고르는 중이다…'],
  stop: ['거기 너! 걸렸다.', '화살이 가리키는 놈, 쏴라.', '허허, 운명이다. 받아들여라.', '딱 걸렸구나. 지갑을 열거라.', '하늘의 뜻이다. 토 달지 말거라.'],
};
const arrow = { angle: 0, busy: false, spins: 0 };
const ARROW_PIVOT = { fx: 0.0067, fy: 0.1336 };   // 화살표 그림에서 꼬리 끝의 위치 (가로·세로 비율)
// 화살표 길이를 wheel 폭의 절반에 맞추고, 꼬리 끝이 wheel 정중앙(축)에 오도록 배치
function layoutArrow() {
  const wheel = $('wheel'), img = $('arrow-img'), sp = $('spinner');
  const size = wheel.clientWidth || 340;
  const len = Math.floor(size / 2 - 10);
  const ratio = (img.naturalHeight || 296) / (img.naturalWidth || 900);
  const h = len * ratio, px = len * ARROW_PIVOT.fx, py = h * ARROW_PIVOT.fy;
  img.style.width = len + 'px';
  sp.style.marginLeft = -px + 'px'; sp.style.marginTop = -py + 'px';
  sp.style.transformOrigin = `${px}px ${py}px`;
  sp.style.transform = `rotate(${arrow.angle}deg)`;
}
window.addEventListener('resize', () => { if ($('s-arrow').classList.contains('active')) layoutArrow(); });
function openArrow() {
  arrow.spins = 0; $('ar-count').textContent = '';
  say(pickOne(ARROW_LINES.start), 'ar-bubble');
  show('s-arrow');
  layoutArrow();
  $('arrow-img').decode?.().then(layoutArrow).catch(() => {});
}
function spinArrow() {
  if (arrow.busy) return;
  arrow.busy = true; $('hub').disabled = true;
  say(pickOne(ARROW_LINES.spin), 'ar-bubble');
  // 10~16바퀴를 6~8초 동안: 초반엔 쌩쌩 돌다가 후반에 아주 천천히 기어가며 멈춘다
  const from = arrow.angle, total = randInt(10, 16) * 360 + randInt(0, 359), to = from + total;
  const dur = 6000 + randInt(0, 2200);
  const el = $('spinner');
  const anim = el.animate(
    [{ transform: `rotate(${from}deg)` }, { transform: `rotate(${to}deg)` }],
    { duration: dur, easing: 'cubic-bezier(.04,.62,.06,1)', fill: 'forwards' }
  );
  // 회전 속도에 맞춘 틱 진동: 빠를 땐 촘촘히, 느려질수록 띄엄띄엄
  [0.04, 0.09, 0.14, 0.2, 0.27, 0.35, 0.44, 0.54, 0.65, 0.76, 0.86, 0.94].forEach(t => setTimeout(() => vibrate(12), dur * t));
  setTimeout(() => say(pickOne(['슬슬 멈춘다… 누구냐…', '거의 다 왔다…', '숨 참아라…']), 'ar-bubble'), dur * 0.62);
  anim.onfinish = () => {
    arrow.angle = ((to % 360) + 360) % 360;
    el.style.transform = `rotate(${arrow.angle}deg)`; anim.cancel();
    arrow.busy = false; $('hub').disabled = false;
    arrow.spins += 1; $('ar-count').textContent = `${arrow.spins}번째`;
    say(pickOne(ARROW_LINES.stop), 'ar-bubble');
    vibrate([60, 40, 140]);
    document.body.classList.add('flash-lose');
    setTimeout(() => document.body.classList.remove('flash-lose'), 700);
  };
}

/* ---------- 초기화 ---------- */
document.querySelectorAll('.arena').forEach(buildArena);
// 도사 그림은 한 곳(플레이 화면)에만 내장하고 다른 화면은 그걸 가져다 쓴다
const DOSA_SRC = document.querySelector('#dosa .portrait').src;
['title-portrait', 'ar-portrait', 'count-portrait', 'tm-portrait', 'sk-portrait'].forEach(id => { $(id).src = DOSA_SRC; });
</script>
